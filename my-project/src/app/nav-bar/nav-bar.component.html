<nav class="bg-surface border-line shadow-sm">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    
    <!-- Logo -->
    <a (click)="scrollTo('home')" class="cursor-pointer flex items-center space-x-3 gap-2 rtl:space-x-reverse">
      <img src="assets/ux-ui-00.png" class="h-8" alt="Logo" />
      <span class="self-center text-xl font-semibold whitespace-nowrap text-primary">HASSAN GAMAL</span>
    </a>

    <!-- Right-side controls: theme toggle + burger -->
    <div class="flex items-center gap-2 md:order-2">
      <!-- Theme toggle -->
      <button
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
        title="Toggle theme"
        class="inline-flex items-center justify-center p-2 w-10 h-10 rounded-lg text-ink-muted hover:bg-muted hover:text-primary focus:outline-none focus:ring-2 focus:ring-primary transition-colors"
      >
        @if (isDark) {
          <!-- Sun icon -->
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5m0 15V21m9-9h-1.5m-15 0H3m15.36 6.36l-1.06-1.06M6.7 6.7L5.64 5.64m12.72 0L17.3 6.7M6.7 17.3l-1.06 1.06M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8z" />
          </svg>
        } @else {
          <!-- Moon icon -->
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" />
          </svg>
        }
      </button>

    <!-- Burger Button -->
    <button
      type="button"
      (click)="isOpen = !isOpen"
      class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-ink-muted rounded-lg md:hidden hover:bg-muted focus:outline-none focus:ring-2 focus:ring-primary"
    >
      <span class="sr-only">Open main menu</span>

      <!-- @if syntax for icons -->
      @if (!isOpen) {
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M1 1h15M1 7h15M1 13h15" />
        </svg>
      } @else {
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      }
    </button>
    </div>

    <!-- Nav Links -->
    <div
      [ngClass]="isOpen ? 'block' : 'hidden'"
      class="w-full md:block md:w-auto"
    >
      <ul
        class="font-medium flex flex-col p-4 mt-4 border border-line rounded-lg bg-muted
               md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-transparent gap-4"
      >
        <li>
          <a (click)="scrollTo('home')" [attr.aria-current]="activeSection === 'home' ? 'page' : null" [ngClass]="activeSection === 'home' ? 'text-primary font-semibold md:border-b-2 md:border-primary' : 'text-ink md:hover:text-primary'" class="block py-2 px-3 hover:bg-muted md:hover:bg-transparent md:p-0 rounded-sm cursor-pointer transition-colors">Home</a>
        </li>
        <li>
          <a (click)="scrollTo('about')" [attr.aria-current]="activeSection === 'about' ? 'page' : null" [ngClass]="activeSection === 'about' ? 'text-primary font-semibold md:border-b-2 md:border-primary' : 'text-ink md:hover:text-primary'" class="block py-2 px-3 hover:bg-muted md:hover:bg-transparent md:p-0 rounded-sm cursor-pointer transition-colors">About</a>
        </li>
        <li>
          <a (click)="scrollTo('works')" [attr.aria-current]="activeSection === 'works' ? 'page' : null" [ngClass]="activeSection === 'works' ? 'text-primary font-semibold md:border-b-2 md:border-primary' : 'text-ink md:hover:text-primary'" class="block py-2 px-3 hover:bg-muted md:hover:bg-transparent md:p-0 rounded-sm cursor-pointer transition-colors">Portfolio</a>
        </li>
        <li>
          <a (click)="scrollTo('contact')" [attr.aria-current]="activeSection === 'contact' ? 'page' : null" [ngClass]="activeSection === 'contact' ? 'text-primary font-semibold md:border-b-2 md:border-primary' : 'text-ink md:hover:text-primary'" class="block py-2 px-3 hover:bg-muted md:hover:bg-transparent md:p-0 rounded-sm cursor-pointer transition-colors">Contact</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
